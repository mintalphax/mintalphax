<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.5" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#C98A00"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E8A800"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1.2">
      <stop offset="0" stop-color="#161D2E"/>
      <stop offset="0.55" stop-color="#101624"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- faint circuit bus along the bottom -->
  <g stroke="#1D2431" stroke-width="3" fill="none">
    <path d="M 40 292 H 1240"/>
    <path d="M 620 292 V 262 H 760"/>
    <path d="M 900 292 V 268 H 1020"/>
    <path d="M 1120 292 V 256 H 1210"/>
  </g>
  <g fill="#58A6FF" opacity="0.85">
    <circle cx="760" cy="262" r="5"/>
    <circle cx="1020" cy="268" r="5"/>
    <circle cx="1210" cy="256" r="5"/>
  </g>

  <!-- watermark alpha, right side -->
  <g transform="translate(980,-30) scale(0.8)" opacity="0.06">
    <ellipse cx="225" cy="268" rx="78" ry="70" fill="none" stroke="#F0B90B" stroke-width="34"/>
    <path d="M 306 196 C 388 204 378 330 262 338" fill="none" stroke="#F0B90B" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- alpha mark -->
  <g transform="translate(30,10) scale(0.55)">
    <ellipse cx="225" cy="268" rx="78" ry="70" fill="none" stroke="url(#gold)" stroke-width="34"/>
    <path d="M 306 196 C 388 204 378 330 262 338"
          fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="346" cy="382" r="12" fill="url(#gold)"/>
    <circle cx="370" cy="402" r="8" fill="url(#gold)"/>
    <circle cx="390" cy="420" r="5.5" fill="url(#gold)"/>
  </g>

  <!-- wordmark -->
  <text x="310" y="142" font-family="Menlo, Consolas, 'Courier New', monospace"
        font-size="62" font-weight="bold" letter-spacing="6"
        fill="url(#goldText)">MINTALPHAX</text>
  <text x="314" y="192" font-family="Menlo, Consolas, 'Courier New', monospace"
        font-size="22" letter-spacing="2" fill="#8B949E">ALPHA AT THE SILICON &#215; CRYPTO SEAM</text>
  <text x="314" y="234" font-family="'PingFang SC', 'Hiragino Sans GB', sans-serif"
        font-size="23" letter-spacing="1" fill="#6E7681">硅基掘金 · 挖 alpha，造工具</text>
</svg>
