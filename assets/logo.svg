<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D77E"/>
      <stop offset="0.5" stop-color="#E8B33B"/>
      <stop offset="1" stop-color="#B07E14"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="1.0">
      <stop offset="0" stop-color="#13202A"/>
      <stop offset="1" stop-color="#0B1218"/>
    </radialGradient>
  </defs>

  <!-- dark navy-teal field -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- gold coin -->
  <circle cx="256" cy="256" r="196" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#8A6410" stroke-width="7"
          stroke-dasharray="5 9" opacity="0.75"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#8A6410" stroke-width="2.5" opacity="0.5"/>

  <!-- mint traces radiating from the die to the rim -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#7FD9BC" stroke-width="9" opacity="0.28">
      <path d="M 166 256 H 108 L 84 232"/>
      <path d="M 346 256 H 404 L 428 280"/>
      <path d="M 256 166 V 108 L 280 84"/>
      <path d="M 256 346 V 404 L 232 428"/>
      <path d="M 193 193 L 150 150"/>
      <path d="M 319 319 L 362 362"/>
    </g>
    <g stroke="#9BF0D2" stroke-width="3.5">
      <path d="M 166 256 H 108 L 84 232"/>
      <path d="M 346 256 H 404 L 428 280"/>
      <path d="M 256 166 V 108 L 280 84"/>
      <path d="M 256 346 V 404 L 232 428"/>
      <path d="M 193 193 L 150 150"/>
      <path d="M 319 319 L 362 362"/>
    </g>
  </g>
  <g fill="#9BF0D2">
    <circle cx="84" cy="232" r="7"/>
    <circle cx="428" cy="280" r="7"/>
    <circle cx="280" cy="84" r="7"/>
    <circle cx="232" cy="428" r="7"/>
    <circle cx="150" cy="150" r="7"/>
    <circle cx="362" cy="362" r="7"/>
  </g>

  <!-- recessed die -->
  <rect x="166" y="166" width="180" height="180" rx="26" fill="#0B1218"
        stroke="#E8B33B" stroke-width="3" opacity="0.98"/>

  <!-- alpha on the die -->
  <g transform="translate(146,143) scale(0.42)" fill="none" stroke="url(#gold)" stroke-width="48">
    <ellipse cx="225" cy="268" rx="78" ry="70"/>
    <path d="M 306 196 C 388 204 378 330 262 338" stroke-linecap="round"/>
  </g>
</svg>
