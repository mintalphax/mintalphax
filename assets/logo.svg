<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.5" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#C98A00"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="1.0">
      <stop offset="0" stop-color="#1B2437"/>
      <stop offset="0.6" stop-color="#111726"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
  </defs>

  <!-- chip package -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- pins -->
  <g stroke="#3A424D" stroke-width="13" stroke-linecap="round">
    <line x1="170" y1="94" x2="170" y2="58"/>
    <line x1="256" y1="94" x2="256" y2="58"/>
    <line x1="342" y1="94" x2="342" y2="58"/>
    <line x1="170" y1="418" x2="170" y2="454"/>
    <line x1="256" y1="418" x2="256" y2="454"/>
    <line x1="342" y1="418" x2="342" y2="454"/>
    <line x1="94" y1="170" x2="58" y2="170"/>
    <line x1="94" y1="256" x2="58" y2="256"/>
    <line x1="94" y1="342" x2="58" y2="342"/>
    <line x1="418" y1="170" x2="454" y2="170"/>
    <line x1="418" y1="256" x2="454" y2="256"/>
    <line x1="418" y1="342" x2="454" y2="342"/>
  </g>

  <!-- die outline -->
  <rect x="96" y="96" width="320" height="320" rx="44" fill="none" stroke="#2B3340" stroke-width="9"/>

  <!-- circuit traces with pads on the die edge -->
  <g stroke="#58A6FF" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M 148 268 H 120"/>
    <path d="M 236 100 V 128"/>
  </g>
  <g fill="none" stroke="#58A6FF" stroke-width="6">
    <circle cx="114" cy="268" r="8"/>
    <circle cx="236" cy="136" r="8"/>
  </g>

  <!-- alpha: pickaxe head = loop, handle = tail -->
  <g transform="rotate(-14 240 268)">
    <ellipse cx="225" cy="268" rx="78" ry="70" fill="none" stroke="url(#gold)" stroke-width="34"/>
    <path d="M 306 196 C 388 204 378 330 262 338"
          fill="none" stroke="url(#gold)" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- gold nuggets dug out along the swing -->
  <circle cx="346" cy="382" r="12" fill="url(#gold)"/>
  <circle cx="370" cy="402" r="8" fill="url(#gold)"/>
  <circle cx="390" cy="420" r="5.5" fill="url(#gold)"/>
</svg>
